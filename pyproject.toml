[project]
name = "rag-research-papers"
version = "0.1.0"
description = "RAG over research papers with LangChain, FAISS/Chroma, and retrieval evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",
    "langchain>=0.2.16",
    "langchain-community>=0.2.16",
    "langchain-core>=0.2.38",
    "langchain-huggingface>=0.0.3",
    "langchain-openai>=0.1.23",
    "langchain-text-splitters>=0.2.4",
    "pandas>=2.2.2",
    "pymupdf>=1.24.9",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.1",
    "typer>=0.12.5",
]

[project.scripts]
rag = "rag_papers.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_papers"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
